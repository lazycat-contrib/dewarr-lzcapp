application:
  subdomain: dewarr
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://dewarr:8000/
  injects:
    # 首次创建管理员账号：捕获用户名与密码
    - id: dewarr-capture-credentials
      auth_required: false
      on: request
      when:
        - /api/auth/bootstrap
      do: |
        let payload = null;
        try {
          payload = ctx.body.getJSON();
        } catch {
          payload = null;
        }
        if (!payload || typeof payload !== "object") return;
        if (typeof payload.username === "string" && payload.username) {
          ctx.flow.set("dewarr_username", payload.username);
        }
        if (typeof payload.password === "string" && payload.password) {
          ctx.flow.set("dewarr_password", payload.password);
        }

    # 创建成功后持久化，供登录页自动填充
    - id: dewarr-commit-credentials
      auth_required: false
      on: response
      when:
        - /api/auth/bootstrap
      do: |
        if (ctx.status < 200 || ctx.status >= 300) return;
        const username = ctx.flow.get("dewarr_username");
        const password = ctx.flow.get("dewarr_password");
        if (typeof username === "string" && username) {
          ctx.persist.set("dewarr.username", username);
        }
        if (typeof password === "string" && password) {
          ctx.persist.set("dewarr.password", password);
        }

    # 免密登录：未登录时的登录表单自动填充（不自动提交）
    - id: dewarr-login-autofill
      when:
        - /
      do:
        - src: builtin://simple-inject-password
          params:
            user:
              $persist: dewarr.username
            password:
              $persist: dewarr.password
            userSelector: "input[autocomplete='username']"
            passwordSelector: "input[autocomplete='current-password']"
            autoSubmit: false

services:
  postgres:
    # upstream: postgres:18 (docker.io)
    image: docker.1ms.run/postgres:18
    environment:
      - POSTGRES_DB=dewarr
      - POSTGRES_USER=dewarr
      - POSTGRES_PASSWORD={{ stable_secret "db_password" }}
    binds:
      - /lzcapp/var/postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dewarr -d dewarr
      interval: 5s
      timeout: 5s
      retries: 12

  dewarr:
    # upstream: ghcr.io/logabell/dewarr:v0.2.3
    image: ghcr.1ms.run/logabell/dewarr:v0.2.3
    depends_on:
      - postgres
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PUBLIC_URL=https://${LAZYCAT_SUBDOMAIN}.${LAZYCAT_BOX_DOMAIN}
      - DB_HOST=postgres
      - DB_NAME=dewarr
      - DB_USER=dewarr
      - DB_PASSWORD={{ stable_secret "db_password" }}
    binds:
      - /lzcapp/var/dewarr/config:/config
      - /lzcapp/var/dewarr/data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

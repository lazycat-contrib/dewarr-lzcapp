version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/dewarr.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: dewarr

build:
  run_buildscript: false

images:
  - id: dewarr
    target: service
    service: dewarr
    source: ghcr.io/logabell/dewarr
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Dewarr
    summary: "自托管有声书发现与自动下载（懒猫版）"
